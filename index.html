<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Толстый CRT-монитор. Фото лежит в assets/monitor.jpg -->
  <div class="monitor" id="monitor">
    <div class="screen" id="screen">
      <!-- Внутри «экрана» — рабочий стол Windows 98 -->
      <div class="desktop" id="desktop">

        <div class="icons" id="icons">
          <div class="icon" data-open="computer">
            <div class="icon-img computer">🖥️</div>
            <span>Мой компьютер</span>
          </div>
        </div>

        <div class="taskbar" id="taskbar">
          <button class="start" id="startBtn"><span class="flag"></span>Пуск</button>
          <div class="tasklist" id="tasklist"></div>
          <div class="tray"><span id="clock">--:--</span></div>
        </div>

        <!-- Меню Пуск -->
        <div class="startmenu" id="startMenu" hidden>
          <div class="sm-side">SCP<br>Terminal</div>
          <div class="sm-items">
            <div class="sm-item" data-open="computer"><span class="flag"></span>Этот компьютер</div>
            <div class="sm-item" data-open="db"><span class="flag"></span>База данных о</div>
            <div class="sm-sep"></div>
            <div class="sm-item" id="smRestart">⟳ Перезагрузка</div>
            <div class="sm-item" id="smShutdown">⏻ Выключение</div>
            <div class="sm-sep"></div>
            <div class="sm-item" id="smAbout">О системе…</div>
          </div>
        </div>
      </div>

      <!-- Экран блокировки (перед запуском рабочего стола) -->
      <div class="lockscreen" id="lockScreen" hidden>
        <div class="lock-dialog">
          <div class="lock-titlebar">Вход в систему</div>
          <div class="lock-body">
            <div class="lock-user" id="lockUser">
              <div class="lock-avatar"></div>
              <div class="lock-name">user</div>
            </div>
            <div class="lock-hint">Нажмите на пользователя</div>
            <button class="lock-enter" id="lockEnter" hidden>Войти</button>
          </div>
        </div>
      </div>

      <!-- Экран включения / выключения / перезагрузки -->
      <div class="powerscreen" id="powerScreen" hidden>
        <div class="power-msg" id="powerMsg">Включение…</div>
        <button class="power-btn" id="powerBtn" hidden>⏻</button>
      </div>

      <!-- Эффекты «аналогового» экрана -->
      <div class="crt-overlay"></div>
      <div class="glare"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
