<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Толстый CRT-монитор. Фото лежит в assets/monitor.jpg -->
  <div class="monitor" id="monitor">
    <div class="screen" id="screen">
      <!-- Внутри «экрана» — рабочий стол Windows 98 -->
      <div class="desktop" id="desktop">

        <div class="icons" id="icons">
          <div class="icon" data-open="explorer">
            <div class="icon-img folder"></div>
            <span>База данных о</span>
          </div>
        </div>

        <div class="taskbar" id="taskbar">
          <button class="start" id="startBtn"><span class="flag"></span>Пуск</button>
          <div class="tasklist" id="tasklist"></div>
          <div class="tray"><span id="clock">--:--</span></div>
        </div>

        <!-- Меню Пуск -->
        <div class="startmenu" id="startMenu" hidden>
          <div class="sm-side">SCP<br>Terminal</div>
          <div class="sm-items">
            <div class="sm-item" data-open="explorer"><span class="flag"></span>База данных о</div>
            <div class="sm-sep"></div>
            <div class="sm-item" id="smAbout">О системе…</div>
          </div>
        </div>
      </div>

      <!-- Эффекты «аналогового» экрана -->
      <div class="crt-overlay"></div>
      <div class="glare"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
